<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, modern web calculator built with HTML, CSS and JavaScript" />
  <title>Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <section class="display">
      <div class="display__history" id="history" aria-live="polite">&nbsp;</div>
      <div class="display__current" id="display" role="textbox" aria-readonly="true">0</div>
    </section>

    <section class="keypad">
      <button class="key key--function" data-action="clear" aria-label="Clear all">AC</button>
      <button class="key key--function" data-action="sign" aria-label="Toggle sign">&plusmn;</button>
      <button class="key key--function" data-action="percent" aria-label="Percent">%</button>
      <button class="key key--operator" data-operator="divide" aria-label="Divide">&divide;</button>

      <button class="key key--digit" data-digit="7">7</button>
      <button class="key key--digit" data-digit="8">8</button>
      <button class="key key--digit" data-digit="9">9</button>
      <button class="key key--operator" data-operator="multiply" aria-label="Multiply">&times;</button>

      <button class="key key--digit" data-digit="4">4</button>
      <button class="key key--digit" data-digit="5">5</button>
      <button class="key key--digit" data-digit="6">6</button>
      <button class="key key--operator" data-operator="subtract" aria-label="Subtract">&minus;</button>

      <button class="key key--digit" data-digit="1">1</button>
      <button class="key key--digit" data-digit="2">2</button>
      <button class="key key--digit" data-digit="3">3</button>
      <button class="key key--operator" data-operator="add" aria-label="Add">+</button>

      <button class="key key--digit key--zero" data-digit="0">0</button>
      <button class="key key--digit" data-action="decimal">.</button>
      <button class="key key--function" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key key--equals" data-action="equals" aria-label="Calculate">=</button>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
